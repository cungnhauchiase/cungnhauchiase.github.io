<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Liên hệ Cùng Nhau Chia Sẻ</title>
  <meta name="description" content="Liên hệ Bích Trâm - Cùng Nhau Chia Sẻ để được tư vấn và hỗ trợ nhanh chóng." />
  <meta property="og:title" content="Liên hệ Cùng Nhau Chia Sẻ" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Liên hệ Bích Trâm - Cùng Nhau Chia Sẻ để được tư vấn và hỗ trợ nhanh chóng." />

  <link rel="apple-touch-icon" sizes="150x150" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgvvO9w9_qhYbzEYvoBQyzibUKswrAi6Zl-IqLLubEw5eajtkm4utmHfOQDSiXGRw3bNInJ7h0vlrAonnof9F7zZTY0ly6c0s5-4vCiBz4QqSXOQiOFTNAXTzUxUA2jCQI-T2QziqgchmvuqnjnrSE8GxVCxUR_MFmNqrJuv4RMQEac5cdQH1U4daBGrYei/s1600/Favicon-Cung-Nhau-Chia-Se-150.png" />
  <link rel="icon" sizes="96x96" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjG2WERINX8bYhKUFbFIEIS812TdttfCqyZ2JSIsg6eBh8HQSxiMPO-GPvLb-aQObPT-1owOHLBP328uoLijb8urIOyizfIJL02eZ6d4wz7DWD8C2CIWPzC621BGkdjboY_plAVCwuvE7spVL3HHz7zH0rxxwy5HyEGjL13s2GJS2aaif_P8LuGwRNCkKYV/s1600/Favicon-Cung-Nhau-Chia-Se-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand: #17a800;
      --brand-dark: #128500;
      --brand-light: #eefaf0;
      --brand-border: #b7e4b0;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-page: linear-gradient(160deg, #f3fbf2 0%, #e7f6e6 55%, #f8fcf7 100%);
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 14px 36px rgba(23, 168, 0, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Open Sans", sans-serif;
      color: var(--text-main);
      background: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      line-height: 1.6;
    }

    .contact-page {
      width: 100%;
      max-width: 520px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: var(--brand);
      border: 1px solid var(--brand-border);
      padding: 5px 14px;
      border-radius: 999px;
      font-family: "Mulish", sans-serif;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(23, 168, 0, 0.08);
    }

    .brand-badge img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-title {
      font-family: "Mulish", sans-serif;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      color: var(--brand);
      line-height: 1.3;
      letter-spacing: 0.2px;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    .form-heading {
      font-family: "Mulish", sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--brand);
      text-align: center;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--brand-light);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: "Mulish", sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      font-family: "Open Sans", sans-serif;
      font-size: 15px;
      color: var(--text-main);
      background-color: #ffffff;
      border: 1.5px solid #cde8c9;
      border-radius: 10px;
      padding: 11px 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control::placeholder {
      color: #88a884;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 168, 0, 0.16);
    }

    textarea.form-control {
      min-height: 118px;
      resize: vertical;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 10px;
      font-family: "Mulish", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--brand);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(23, 168, 0, 0.22);
    }

    .btn-primary:hover {
      background-color: var(--brand-dark);
    }

    .btn-outline {
      background-color: var(--brand-light);
      color: var(--brand);
      border: 1.5px solid var(--brand);
    }

    .btn-outline:hover {
      background-color: var(--brand);
      color: #ffffff;
    }

    .alert-box {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .alert-success {
      display: block;
      background-color: var(--brand-light);
      color: var(--brand-dark);
      border: 1px solid var(--brand);
    }

    .alert-error {
      display: block;
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .contact-card {
        padding: 22px 16px;
        border-radius: 12px;
      }

      .form-heading {
        font-size: 18px;
        margin-bottom: 18px;
      }

      .btn {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="contact-page">
    <header class="brand-header">
      <div class="brand-badge">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjG2WERINX8bYhKUFbFIEIS812TdttfCqyZ2JSIsg6eBh8HQSxiMPO-GPvLb-aQObPT-1owOHLBP328uoLijb8urIOyizfIJL02eZ6d4wz7DWD8C2CIWPzC621BGkdjboY_plAVCwuvE7spVL3HHz7zH0rxxwy5HyEGjL13s2GJS2aaif_P8LuGwRNCkKYV/s1600/Favicon-Cung-Nhau-Chia-Se-96.png" alt="Logo Cùng Nhau Chia Sẻ" />
        <span>Cùng Nhau Chia Sẻ</span>
      </div>
      <h1 class="brand-title">BÍCH TRÂM<br />CÙNG NHAU CHIA SẺ</h1>
    </header>

    <section class="contact-card" aria-labelledby="formTitle">
      <h2 id="formTitle" class="form-heading">Nội dung cần liên hệ</h2>

      <form id="contactForm" method="post" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Họ và tên</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            placeholder="Nhập họ và tên"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Số điện thoại</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            class="form-control"
            placeholder="Nhập số điện thoại"
            pattern="(\+84|0)(9|8|7|5|3)[0-9]{8}"
            autocomplete="tel"
            required
          />
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Để lại lời nhắn</label>
          <textarea
            id="message"
            name="message"
            class="form-control"
            placeholder="Nhập lời nhắn"
            required
          ></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Gửi liên hệ</button>
          <a href="https://www.cungnhauchiase.com/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
            Quay lại Trang chủ
          </a>
        </div>

        <div id="formStatus" class="alert-box" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById("contactForm");
      const statusBox = document.getElementById("formStatus");
      const phoneInput = document.getElementById("phone");
      const phoneRegex = /^(\+84|0)(9|8|7|5|3)[0-9]{8}$/;

      function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = "alert-box " + (type === "success" ? "alert-success" : "alert-error");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const nameVal = form.name.value.trim();
        const phoneVal = phoneInput.value.trim().replace(/\s+/g, "");
        const messageVal = form.message.value.trim();

        if (!nameVal) {
          showStatus("Vui lòng nhập họ và tên.", "error");
          form.name.focus();
          return;
        }

        if (!phoneRegex.test(phoneVal)) {
          showStatus("Vui lòng nhập số điện thoại hợp lệ (10 số, đầu 03, 05, 07, 08, 09 hoặc +84).", "error");
          phoneInput.focus();
          return;
        }

        if (!messageVal) {
          showStatus("Vui lòng nhập lời nhắn cần hỗ trợ.", "error");
          form.message.focus();
          return;
        }

        // Nếu muốn gửi dữ liệu sang Google Apps Script / Webhook / Formspree,
        // bạn có thể dán endpoint URL vào biến ENDPOINT_URL bên dưới:
        const ENDPOINT_URL = "";

        if (!ENDPOINT_URL) {
          showStatus("Cảm ơn bạn đã quan tâm! Thông tin liên hệ của bạn đã được ghi nhận.", "success");
          form.reset();
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Đang gửi...";

        fetch(ENDPOINT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: nameVal,
            phone: phoneVal,
            message: messageVal,
            source: window.location.href,
            submittedAt: new Date().toISOString()
          })
        })
          .then(function (res) {
            if (!res.ok) throw new Error("Network error");
            showStatus("Cảm ơn bạn đã quan tâm!", "success");
            form.reset();
          })
          .catch(function () {
            showStatus("Có lỗi khi gửi liên hệ. Vui lòng thử lại sau.", "error");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Gửi liên hệ";
          });
      });
    })();
  </script>
</body>
</html>
