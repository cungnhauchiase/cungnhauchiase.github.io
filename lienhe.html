<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Liên hệ Cùng Nhau Chia Sẻ</title>
  <meta name="description" content="Liên hệ Bích Trâm - Cùng Nhau Chia Sẻ để được tư vấn và hỗ trợ nhanh chóng." />
  <meta property="og:title" content="Liên hệ Cùng Nhau Chia Sẻ" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Liên hệ Bích Trâm - Cùng Nhau Chia Sẻ để được tư vấn và hỗ trợ nhanh chóng." />

  <link rel="apple-touch-icon" sizes="150x150" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgvvO9w9_qhYbzEYvoBQyzibUKswrAi6Zl-IqLLubEw5eajtkm4utmHfOQDSiXGRw3bNInJ7h0vlrAonnof9F7zZTY0ly6c0s5-4vCiBz4QqSXOQiOFTNAXTzUxUA2jCQI-T2QziqgchmvuqnjnrSE8GxVCxUR_MFmNqrJuv4RMQEac5cdQH1U4daBGrYei/s1600/Favicon-Cung-Nhau-Chia-Se-150.png" />
  <link rel="icon" sizes="96x96" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjG2WERINX8bYhKUFbFIEIS812TdttfCqyZ2JSIsg6eBh8HQSxiMPO-GPvLb-aQObPT-1owOHLBP328uoLijb8urIOyizfIJL02eZ6d4wz7DWD8C2CIWPzC621BGkdjboY_plAVCwuvE7spVL3HHz7zH0rxxwy5HyEGjL13s2GJS2aaif_P8LuGwRNCkKYV/s1600/Favicon-Cung-Nhau-Chia-Se-96.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand: #17a800;
      --brand-dark: #128500;
      --brand-light: #eefaf0;
      --brand-border: #b7e4b0;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --danger-border: #fca5a5;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-page: linear-gradient(160deg, #f3fbf2 0%, #e7f6e6 55%, #f8fcf7 100%);
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 14px 36px rgba(23, 168, 0, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Open Sans", sans-serif;
      color: var(--text-main);
      background: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      line-height: 1.6;
    }

    .contact-page {
      width: 100%;
      max-width: 520px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: var(--brand);
      border: 1px solid var(--brand-border);
      padding: 5px 14px;
      border-radius: 999px;
      font-family: "Mulish", sans-serif;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(23, 168, 0, 0.08);
    }

    .brand-badge img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-title {
      font-family: "Mulish", sans-serif;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      color: var(--brand);
      line-height: 1.3;
      letter-spacing: 0.2px;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    .form-heading {
      font-family: "Mulish", sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--brand);
      text-align: center;
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--brand-light);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: "Mulish", sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      font-family: "Open Sans", sans-serif;
      font-size: 15px;
      color: var(--text-main);
      background-color: #ffffff;
      border: 1.5px solid #cde8c9;
      border-radius: 10px;
      padding: 11px 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control::placeholder {
      color: #88a884;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 168, 0, 0.16);
    }

    .form-control.is-invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.14);
    }

    textarea.form-control {
      min-height: 118px;
      resize: vertical;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 10px;
      font-family: "Mulish", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--brand);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(23, 168, 0, 0.22);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--brand-dark);
    }

    .btn-outline {
      background-color: var(--brand-light);
      color: var(--brand);
      border: 1.5px solid var(--brand);
    }

    .btn-outline:hover {
      background-color: var(--brand);
      color: #ffffff;
    }

    /* Popup Modal */
    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .popup-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .popup-dialog {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 22px 20px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
      transform: scale(0.94) translateY(8px);
      transition: transform 0.2s ease;
      border: 1.5px solid var(--brand-border);
    }

    .popup-backdrop.show .popup-dialog {
      transform: scale(1) translateY(0);
    }

    .popup-dialog.popup-error {
      border-color: var(--danger-border);
    }

    .popup-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
    }

    .popup-success .popup-icon {
      background: var(--brand-light);
      color: var(--brand);
      border: 2px solid var(--brand);
    }

    .popup-error .popup-icon {
      background: var(--danger-light);
      color: var(--danger);
      border: 2px solid var(--danger);
    }

    .popup-title {
      font-family: "Mulish", sans-serif;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .popup-success .popup-title {
      color: var(--brand);
    }

    .popup-error .popup-title {
      color: var(--danger);
    }

    .popup-message {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.55;
    }

    .popup-btn {
      width: 100%;
      min-height: 42px;
      border: none;
      border-radius: 10px;
      font-family: "Mulish", sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .popup-success .popup-btn {
      background: var(--brand);
    }

    .popup-success .popup-btn:hover {
      background: var(--brand-dark);
    }

    .popup-error .popup-btn {
      background: var(--danger);
    }

    .popup-error .popup-btn:hover {
      background: #b91c1c;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .contact-card {
        padding: 22px 16px;
        border-radius: 12px;
      }

      .form-heading {
        font-size: 18px;
        margin-bottom: 18px;
      }

      .btn {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="contact-page">
    <header class="brand-header">
      <div class="brand-badge">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjG2WERINX8bYhKUFbFIEIS812TdttfCqyZ2JSIsg6eBh8HQSxiMPO-GPvLb-aQObPT-1owOHLBP328uoLijb8urIOyizfIJL02eZ6d4wz7DWD8C2CIWPzC621BGkdjboY_plAVCwuvE7spVL3HHz7zH0rxxwy5HyEGjL13s2GJS2aaif_P8LuGwRNCkKYV/s1600/Favicon-Cung-Nhau-Chia-Se-96.png" alt="Logo Cùng Nhau Chia Sẻ" />
        <span>Cùng Nhau Chia Sẻ</span>
      </div>
      <h1 class="brand-title">BÍCH TRÂM<br />CÙNG NHAU CHIA SẺ</h1>
    </header>

    <section class="contact-card" aria-labelledby="formTitle">
      <h2 id="formTitle" class="form-heading">Nội dung cần liên hệ</h2>

      <form id="contactForm" method="post" novalidate>
        <div class="form-group">
          <label for="name" class="form-label">Họ và tên</label>
          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            placeholder="Nhập họ và tên"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Số điện thoại</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            class="form-control"
            placeholder="Nhập số điện thoại"
            pattern="(\+84|0)(9|8|7|5|3)[0-9]{8}"
            autocomplete="tel"
            required
          />
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Để lại lời nhắn</label>
          <textarea
            id="message"
            name="message"
            class="form-control"
            placeholder="Nhập lời nhắn"
            required
          ></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Gửi liên hệ</button>
          <a href="https://www.cungnhauchiase.com/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
            Quay lại Trang chủ
          </a>
        </div>
      </form>
    </section>
  </main>

  <!-- Popup thông báo -->
  <div id="popupBackdrop" class="popup-backdrop" role="dialog" aria-modal="true" aria-labelledby="popupTitle" aria-describedby="popupMessage">
    <div id="popupDialog" class="popup-dialog popup-success">
      <div id="popupIcon" class="popup-icon">✓</div>
      <h3 id="popupTitle" class="popup-title">Thông báo</h3>
      <p id="popupMessage" class="popup-message"></p>
      <button id="popupCloseBtn" type="button" class="popup-btn">Đóng</button>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("contactForm");
      const nameInput = document.getElementById("name");
      const phoneInput = document.getElementById("phone");
      const messageInput = document.getElementById("message");

      const popupBackdrop = document.getElementById("popupBackdrop");
      const popupDialog = document.getElementById("popupDialog");
      const popupIcon = document.getElementById("popupIcon");
      const popupTitle = document.getElementById("popupTitle");
      const popupMessage = document.getElementById("popupMessage");
      const popupCloseBtn = document.getElementById("popupCloseBtn");

      const phoneRegex = /^(\+84|0)(9|8|7|5|3)[0-9]{8}$/;
      const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbx9f_KDqJz2Juk_z1rNoDCpl6-fXxk3zwcm3iVVYRTgCGTUL8LHE1ZHRcv1LF2SG1bvug/exec";

      let targetFocusAfterClose = null;

      function openPopup(type, title, message, focusEl) {
        targetFocusAfterClose = focusEl || null;
        popupDialog.className = "popup-dialog " + (type === "error" ? "popup-error" : "popup-success");
        popupIcon.textContent = type === "error" ? "!" : "✓";
        popupTitle.textContent = title;
        popupMessage.textContent = message;
        popupCloseBtn.textContent = type === "error" ? "Nhập lại" : "Đã hiểu";

        popupBackdrop.classList.add("show");
        popupCloseBtn.focus();
      }

      function closePopup() {
        popupBackdrop.classList.remove("show");
        if (targetFocusAfterClose) {
          targetFocusAfterClose.focus();
          targetFocusAfterClose = null;
        }
      }

      popupCloseBtn.addEventListener("click", closePopup);

      popupBackdrop.addEventListener("click", function (e) {
        if (e.target === popupBackdrop) {
          closePopup();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && popupBackdrop.classList.contains("show")) {
          closePopup();
        }
      });

      [nameInput, phoneInput, messageInput].forEach(function (input) {
        input.addEventListener("input", function () {
          input.classList.remove("is-invalid");
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const nameVal = nameInput.value.trim();
        const phoneVal = phoneInput.value.trim().replace(/\s+/g, "");
        const messageVal = messageInput.value.trim();

        [nameInput, phoneInput, messageInput].forEach(function (el) {
          el.classList.remove("is-invalid");
        });

        if (!nameVal) {
          nameInput.classList.add("is-invalid");
          openPopup(
            "error",
            "Thiếu thông tin",
            "Vui lòng nhập họ và tên trước khi gửi liên hệ.",
            nameInput
          );
          return;
        }

        if (!phoneRegex.test(phoneVal)) {
          phoneInput.classList.add("is-invalid");
          openPopup(
            "error",
            "Số điện thoại không hợp lệ",
            "Vui lòng nhập số điện thoại di động Việt Nam hợp lệ gồm 10 chữ số, bắt đầu bằng 03, 05, 07, 08, 09 hoặc +84.",
            phoneInput
          );
          return;
        }

        if (!messageVal) {
          messageInput.classList.add("is-invalid");
          openPopup(
            "error",
            "Thiếu lời nhắn",
            "Vui lòng nhập nội dung lời nhắn cần tư vấn hoặc hỗ trợ.",
            messageInput
          );
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Đang gửi...";

        fetch(ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: nameVal,
            phone: phoneVal,
            message: messageVal,
            source: window.location.href
          })
        })
          .then(function () {
            form.reset();
            openPopup(
              "success",
              "Gửi liên hệ thành công!",
              "Cảm ơn bạn đã quan tâm! Bích Trâm — Cùng Nhau Chia Sẻ đã nhận được thông tin và sẽ liên hệ lại với bạn sớm nhất."
            );
          })
          .catch(function () {
            openPopup(
              "error",
              "Gửi không thành công",
              "Đã xảy ra lỗi kết nối khi gửi thông tin. Vui lòng kiểm tra lại mạng và thử lại."
            );
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Gửi liên hệ";
          });
      });
    })();
  </script>
</body>
</html>
